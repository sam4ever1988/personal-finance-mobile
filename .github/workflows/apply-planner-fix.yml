name: Apply planner calculation fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-planner-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch planner logic
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function adjustedConfirmedStatementAmount(p){
 const original=inferStatementOriginalAmount(p);
 const moved=statementAdjustmentTotal(p);
 return Math.max(0,Math.round((original-moved)*100)/100);
}"""
          new="""function adjustedConfirmedStatementAmount(p){
 // V235: statement reductions apply only to genuine released/official statements.
 if(!p || !(p.statementOfficial===true || isGenuineReleasedStatementRow(p))){
  return Math.max(0,Math.round(Number(p?.amount||0)*100)/100);
 }
 const original=inferStatementOriginalAmount(p);
 const moved=statementAdjustmentTotal(p);
 return Math.max(0,Math.round((original-moved)*100)/100);
}"""
          assert old in s
          s=s.replace(old,new,1)
          old2=""" cardPaymentPlan.filter(r=>r.accountId===cardId && r.month===originalMonth).forEach(r=>{
  if(!Number.isFinite(Number(r.statementOriginalAmount)))r.statementOriginalAmount=inferStatementOriginalAmount(r);
  r.installmentTransferAdjustments={...(r.installmentTransferAdjustments||{}),[linkedTx._id]:purchase};"""
          new2=""" cardPaymentPlan.filter(r=>r.accountId===cardId && r.month===originalMonth && (r.statementOfficial===true || isGenuineReleasedStatementRow(r))).forEach(r=>{
  if(!Number.isFinite(Number(r.statementOriginalAmount)))r.statementOriginalAmount=inferStatementOriginalAmount(r);
  r.installmentTransferAdjustments={...(r.installmentTransferAdjustments||{}),[linkedTx._id]:purchase};"""
          assert old2 in s
          s=s.replace(old2,new2,1)
          marker='function normalizeCardPaymentPlan(){'
          repair="""function repairDateDrivenPlannerAdjustmentPollution(){
 let changed=0;
 cardPaymentPlan.forEach(r=>{
  if(r.statementOfficial===true || isGenuineReleasedStatementRow(r))return;
  if(r.installmentTransferAdjustments && Object.keys(r.installmentTransferAdjustments).length){delete r.installmentTransferAdjustments;changed++;}
  if(r.autoGenerated===true && Object.prototype.hasOwnProperty.call(r,'statementOriginalAmount')){delete r.statementOriginalAmount;changed++;}
 });
 if(changed)localStorage.setItem('pf_card_payment_plan',JSON.stringify(cardPaymentPlan));
 return changed;
}

function normalizeCardPaymentPlan(){"""
          assert marker in s
          s=s.replace(marker,repair,1)
          needle=""" localStorage.setItem('pf_card_payment_plan',JSON.stringify(cardPaymentPlan));
}


function cashFlowLedgerKey"""
          repl=""" repairDateDrivenPlannerAdjustmentPollution();
 localStorage.setItem('pf_card_payment_plan',JSON.stringify(cardPaymentPlan));
}


function cashFlowLedgerKey"""
          assert needle in s
          s=s.replace(needle,repl,1)
          s=s.replace('<title>Personal Finance • V234 Sync-Safe Transaction Selection</title>','<title>Personal Finance • V235 Planner Cross-Device Fix</title>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          grep -q 'V235: statement reductions apply only' index.html
          grep -q 'repairDateDrivenPlannerAdjustmentPollution' index.html
          grep -q 'V235 Planner Cross-Device Fix' index.html
      - name: Commit
        run: |
          git config user.name 'planner-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix cross-device card planner calculation'
          git push
