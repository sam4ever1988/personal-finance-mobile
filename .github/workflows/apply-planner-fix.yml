name: Apply planner calculation fix
on:
  push:
    branches: [fix/planner-cross-device-calculation-work]
    paths: ['.github/workflows/apply-planner-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-cross-device-calculation-work
      - name: Patch planner logic
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function adjustedConfirmedStatementAmount(p){
 const original=inferStatementOriginalAmount(p);
 const moved=statementAdjustmentTotal(p);
 return Math.max(0,Math.round((original-moved)*100)/100);
}"""
          new="""function adjustedConfirmedStatementAmount(p){
 // V235: installment-transfer reductions apply only to a genuine released/official statement.
 // Date-driven rows already calculate transactions + installment commitment and must not be reduced again.
 if(!p || !(p.statementOfficial===true || isGenuineReleasedStatementRow(p))){
  return Math.max(0,Math.round(Number(p?.amount||0)*100)/100);
 }
 const original=inferStatementOriginalAmount(p);
 const moved=statementAdjustmentTotal(p);
 return Math.max(0,Math.round((original-moved)*100)/100);
}"""
          assert old in s, 'adjustedConfirmedStatementAmount target not found'
          s=s.replace(old,new,1)
          old2="""function adjustCurrentStatementForInstallment(linkedTx,plan){
 if(!linkedTx||!plan)return;
 const cardId=linkedTx.account, originalMonth=paymentMonthForTransaction(cardId,linkedTx.date);
 const purchase=Math.abs(Number(linkedTx.amount||0)); if(!purchase)return;
 cardPaymentPlan.filter(r=>r.accountId===cardId && r.month===originalMonth).forEach(r=>{
  if(!Number.isFinite(Number(r.statementOriginalAmount)))r.statementOriginalAmount=inferStatementOriginalAmount(r);
  r.installmentTransferAdjustments={...(r.installmentTransferAdjustments||{}),[linkedTx._id]:purchase};
  // Keep amount as the adjusted current-cycle amount for compatibility with older UI/data,
  // while plannerAmountForRow also derives the same result from statementOriginalAmount.
  r.amount=adjustedConfirmedStatementAmount(r);
  r.note=((r.note||'')+` ${money(purchase)} converted to installment and removed from this statement.`).trim();
 });
 const next=addMonths(originalMonth,1);
 if(!plan.startMonth || plan.startMonth<=originalMonth)plan.startMonth=next;"""
          new2="""function adjustCurrentStatementForInstallment(linkedTx,plan){
 if(!linkedTx||!plan)return;
 const cardId=linkedTx.account, originalMonth=paymentMonthForTransaction(cardId,linkedTx.date);
 const purchase=Math.abs(Number(linkedTx.amount||0)); if(!purchase)return;
 // V235: only an actual released/official statement can be reduced when a purchase is converted.
 // Auto/date-driven planner rows already derive their obligation from live transactions + installments.
 cardPaymentPlan.filter(r=>r.accountId===cardId && r.month===originalMonth && (r.statementOfficial===true || isGenuineReleasedStatementRow(r))).forEach(r=>{
  if(!Number.isFinite(Number(r.statementOriginalAmount)))r.statementOriginalAmount=inferStatementOriginalAmount(r);
  r.installmentTransferAdjustments={...(r.installmentTransferAdjustments||{}),[linkedTx._id]:purchase};
  r.amount=adjustedConfirmedStatementAmount(r);
  r.note=((r.note||'')+` ${money(purchase)} converted to installment and removed from this statement.`).trim();
 });
 const next=addMonths(originalMonth,1);
 if(!plan.startMonth || plan.startMonth<=originalMonth)plan.startMonth=next;"""
          assert old2 in s, 'adjustCurrentStatementForInstallment target not found'
          s=s.replace(old2,new2,1)
          # Repair legacy pollution during normalization: date-driven rows must never retain statement-only adjustment state.
          marker="""function normalizeCardPaymentPlan(){"""
          repair="""function repairDateDrivenPlannerAdjustmentPollution(){
 let changed=0;
 cardPaymentPlan.forEach(r=>{
  if(r.statementOfficial===true || isGenuineReleasedStatementRow(r))return;
  if(r.installmentTransferAdjustments && Object.keys(r.installmentTransferAdjustments).length){delete r.installmentTransferAdjustments;changed++;}
  // A manufactured original of zero/auto amount must not turn a calculated cycle into a released statement.
  if(r.autoGenerated===true && Object.prototype.hasOwnProperty.call(r,'statementOriginalAmount')){delete r.statementOriginalAmount;changed++;}
 });
 if(changed)localStorage.setItem('pf_card_payment_plan',JSON.stringify(cardPaymentPlan));
 return changed;
}

function normalizeCardPaymentPlan(){"""
          assert marker in s, 'normalizeCardPaymentPlan marker not found'
          s=s.replace(marker,repair,1)
          # Run repair at the end of normalization before persistence.
          needle=""" localStorage.setItem('pf_card_payment_plan',JSON.stringify(cardPaymentPlan));
}


function cashFlowLedgerKey"""
          repl=""" repairDateDrivenPlannerAdjustmentPollution();
 localStorage.setItem('pf_card_payment_plan',JSON.stringify(cardPaymentPlan));
}


function cashFlowLedgerKey"""
          assert needle in s, 'normalization persistence target not found'
          s=s.replace(needle,repl,1)
          s=s.replace('<title>Personal Finance • V234 Sync-Safe Transaction Selection</title>','<title>Personal Finance • V235 Planner Cross-Device Fix</title>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate patch
        shell: bash
        run: |
          grep -q 'V235: installment-transfer reductions' index.html
          grep -q 'repairDateDrivenPlannerAdjustmentPollution' index.html
          grep -q 'V235 Planner Cross-Device Fix' index.html
      - name: Commit patched app
        shell: bash
        run: |
          git config user.name 'planner-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix cross-device card planner calculation' || exit 0
          git push origin HEAD:fix/planner-cross-device-calculation-work
